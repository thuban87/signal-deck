<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Deck — Trading Dashboard</title>
    <meta name="description" content="Personal trading signal dashboard with real-time market data, technical analysis, and paper trading.">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

    <!-- GridStack — draggable/resizable dashboard widgets -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-extra.min.css">
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>

    <!-- EasyMDE Markdown Editor -->
    <link rel="stylesheet" href="https://unpkg.com/easymde@2.18.0/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde@2.18.0/dist/easymde.min.js"></script>

    <!-- App styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Login screen -->
    <div id="login-screen" class="login-screen hidden">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                </div>
                <h1>Signal Deck</h1>
                <p class="login-subtitle">Trading Signal Dashboard</p>
            </div>
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary btn-full">Sign In</button>
                <p id="login-error" class="login-error hidden"></p>
            </form>
        </div>
    </div>

    <!-- Main app -->
    <div id="app" class="app-container hidden">
        <!-- Mobile hamburger button -->
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <!-- Sidebar overlay (mobile) -->
        <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                    <span>Signal Deck</span>
                </div>
            </div>

            <div class="sidebar-nav">
                <a href="#/dashboard" class="nav-item active" data-page="dashboard" id="nav-dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="#/signals" class="nav-item" data-page="signals" id="nav-signals">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                    </svg>
                    <span>Signals</span>
                    <span id="signal-badge" class="nav-badge hidden">0</span>
                </a>
                <a href="#/backtest" class="nav-item" data-page="backtest" id="nav-backtest">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    <span>Backtest</span>
                </a>
                <a href="#/paper" class="nav-item" data-page="paper" id="nav-paper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Paper Trading</span>
                </a>
                <a href="#/investigate" class="nav-item" data-page="investigate" id="nav-investigate">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="11" y1="8" x2="11" y2="14"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                    <span>Investigator</span>
                </a>
                <a href="#/discover" class="nav-item" data-page="discover" id="nav-discover">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span>Discover</span>
                </a>

                <div class="nav-divider"></div>

                <a href="#/settings" class="nav-item" data-page="settings" id="nav-settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>Settings</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="data-source-badge" id="data-source-badge">
                    <span class="source-dot"></span>
                    <span id="data-source-label">Loading...</span>
                </div>
                <button class="btn btn-ghost btn-sm" id="logout-btn" title="Logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Main content area -->
        <main id="main-content" class="main-content">
            <!-- Pages are rendered here by the router -->
        </main>
    </div>

    <!-- Quick-Logger FAB ("Overheard in the Uber") -->
    <div id="quick-log-fab" class="quick-log-fab hidden" title="Quick-log a ticker idea">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </div>
    <div id="quick-log-panel" class="quick-log-panel hidden">
        <div class="quick-log-header">
            <span>🚗 Quick Log</span>
            <button class="btn btn-ghost btn-sm" id="quick-log-close">&times;</button>
        </div>
        <div class="quick-log-body">
            <input type="text" id="quick-log-input" class="quick-log-input"
                   placeholder='Ticker or company name… e.g. "NVDA" or "Palantir"'
                   autocomplete="off" autofocus>
            <button class="btn btn-primary btn-full" id="quick-log-submit">Log It</button>
            <p id="quick-log-feedback" class="quick-log-feedback hidden"></p>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Add Symbol Modal -->
    <div id="add-symbol-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <h3>Add Symbol to Watchlist</h3>
            <div class="form-group">
                <label for="add-symbol-input">Ticker Symbol</label>
                <input type="text" id="add-symbol-input" placeholder="e.g. GOOGL" maxlength="10">
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="add-symbol-cancel">Cancel</button>
                <button class="btn btn-primary" id="add-symbol-confirm">Add</button>
            </div>
            <p id="add-symbol-error" class="form-error hidden"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/signals.js"></script>
    <script src="/static/js/stock.js"></script>
    <script src="/static/js/backtest.js"></script>
    <script src="/static/js/paper.js"></script>
    <script src="/static/js/investigator.js"></script>
    <script src="/static/js/discover.js"></script>
    <script src="/static/js/settings.js"></script>
</body>
</html>
