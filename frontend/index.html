<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Deck — Trading Dashboard</title>
    <meta name="description" content="Personal trading signal dashboard with real-time market data, technical analysis, and paper trading.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

    <!-- App styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Login screen -->
    <div id="login-screen" class="login-screen hidden">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                </div>
                <h1>Signal Deck</h1>
                <p class="login-subtitle">Trading Signal Dashboard</p>
            </div>
            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary btn-full">Sign In</button>
                <p id="login-error" class="login-error hidden"></p>
            </form>
        </div>
    </div>

    <!-- Main app -->
    <div id="app" class="app-container hidden">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                    <span>Signal Deck</span>
                </div>
            </div>

            <div class="sidebar-nav">
                <a href="#/dashboard" class="nav-item active" data-page="dashboard" id="nav-dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="#/signals" class="nav-item" data-page="signals" id="nav-signals">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                    </svg>
                    <span>Signals</span>
                    <span id="signal-badge" class="nav-badge hidden">0</span>
                </a>
                <a href="#/backtest" class="nav-item" data-page="backtest" id="nav-backtest">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    <span>Backtest</span>
                </a>
                <a href="#/paper" class="nav-item" data-page="paper" id="nav-paper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>Paper Trading</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="data-source-badge" id="data-source-badge">
                    <span class="source-dot"></span>
                    <span id="data-source-label">Loading...</span>
                </div>
                <button class="btn btn-ghost btn-sm" id="logout-btn" title="Logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Main content area -->
        <main id="main-content" class="main-content">
            <!-- Pages are rendered here by the router -->
        </main>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Add Symbol Modal -->
    <div id="add-symbol-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <h3>Add Symbol to Watchlist</h3>
            <div class="form-group">
                <label for="add-symbol-input">Ticker Symbol</label>
                <input type="text" id="add-symbol-input" placeholder="e.g. GOOGL" maxlength="10">
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="add-symbol-cancel">Cancel</button>
                <button class="btn btn-primary" id="add-symbol-confirm">Add</button>
            </div>
            <p id="add-symbol-error" class="form-error hidden"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/signals.js"></script>
    <script src="/static/js/stock.js"></script>
    <script src="/static/js/backtest.js"></script>
    <script src="/static/js/paper.js"></script>
</body>
</html>
